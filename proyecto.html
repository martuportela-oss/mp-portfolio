<title>Proyecto | Martina Portela</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --panel: #141414;
    --text: #f0ede8;
    --muted: #8a857c;
    --accent: #c8b89a;
    --border: rgba(255,255,255,0.08);
    --serif: 'Cormorant Garamond', serif;
    --sans: 'DM Sans', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at top left, rgba(200,184,154,0.08), transparent 28%),
      radial-gradient(circle at bottom right, rgba(200,184,154,0.06), transparent 26%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    line-height: 1.7;
  }

  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }

  .page {
    width: min(1180px, calc(100% - 3rem));
    margin: 0 auto;
    padding: 1.5rem 0 4rem;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    margin-bottom: 3rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    font-family: var(--serif);
    font-size: 1.15rem;
    letter-spacing: 0.04em;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .back-link:hover { color: var(--accent); }

  .hero {
    margin-bottom: 2rem;
  }

  .hero-copy,
  .hero-card,
  .section {
    border: 1px solid var(--border);
    background: rgba(17,17,17,0.82);
    backdrop-filter: blur(14px);
  }

  .hero-copy {
    padding: 2rem 2.2rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 0;
  }

  .hero-copy-body {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.25rem;
  }

  h1 {
    font-family: var(--serif);
    font-size: clamp(2.3rem, 5.5vw, 5.1rem);
    font-weight: 300;
    line-height: 1;
    margin-bottom: 0.95rem;
    overflow-wrap: anywhere;
  }

  .lead {
    max-width: 40rem;
    color: var(--muted);
    font-size: 0.98rem;
  }

  .copy-divider {
    width: 100%;
    height: 1px;
    background: var(--border);
  }

  .copy-block-title {
    font-family: var(--serif);
    font-size: 1.7rem;
    font-weight: 300;
    margin-bottom: 0.7rem;
  }

  .copy-block p {
    color: var(--muted);
    margin-bottom: 0.85rem;
  }

  .hero-card {
    padding: 1.45rem 1.55rem;
    display: block;
    align-self: start;
    min-height: 0;
    background:
      linear-gradient(180deg, rgba(200,184,154,0.04), rgba(200,184,154,0)),
      var(--panel);
  }

  .stat {
    padding: 0.72rem 0;
    border-bottom: 1px solid var(--border);
  }

  .stat:first-child { border-top: 1px solid var(--border); }

  .stat-label {
    display: block;
    margin-bottom: 0.35rem;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stat-value {
    font-family: var(--serif);
    font-size: 1rem;
  }

  .media-stage {
    margin-bottom: 2rem;
    border: 1px solid var(--border);
    background:
      linear-gradient(180deg, rgba(200,184,154,0.04), rgba(255,255,255,0)),
      rgba(17,17,17,0.88);
    backdrop-filter: blur(14px);
    padding: 1.1rem;
  }

  .media-stage-head {
    display: none;
  }

  .media-shell {
    border: 1px solid var(--border);
    background: #0d0d0d;
    overflow: hidden;
  }

  .media-video {
    width: 100%;
    display: block;
    min-height: min(70vh, 760px);
    aspect-ratio: 16 / 9;
    background: #050505;
  }

  .media-image {
    width: 100%;
    display: block;
    background: #050505;
  }

  .gallery-stage {
    margin-bottom: 2rem;
    display: grid;
    gap: 1rem;
  }

  .report-stage {
    margin-bottom: 2rem;
    display: grid;
    gap: 0.9rem;
    border: 1px solid var(--border);
    background:
      linear-gradient(180deg, rgba(200,184,154,0.04), rgba(255,255,255,0)),
      rgba(17,17,17,0.88);
    backdrop-filter: blur(14px);
    padding: 1.1rem;
  }

  .report-copy {
    color: var(--muted);
    font-size: 0.98rem;
  }

  .report-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    min-width: 230px;
    padding: 0.95rem 1.3rem;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }

  .report-link:hover {
    background: var(--accent);
    color: var(--bg);
  }

  .gallery-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .gallery-title {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .gallery-controls {
    display: inline-flex;
    gap: 0.5rem;
  }

  .gallery-arrow {
    width: 2.75rem;
    height: 2.75rem;
    border: 1px solid var(--border);
    background: rgba(17,17,17,0.88);
    color: var(--text);
    font-size: 1.15rem;
    cursor: pointer;
  }

  .gallery-arrow:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .gallery-viewport {
    overflow: hidden;
    border: 1px solid var(--border);
    background: rgba(17,17,17,0.88);
  }

  .gallery-track {
    display: flex;
    transition: transform 0.35s ease;
    will-change: transform;
  }

  .gallery-card {
    min-width: 100%;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .gallery-card img,
  .gallery-card video {
    width: 100%;
    height: min(76vh, 820px);
    display: block;
    object-fit: contain;
    background: #0d0d0d;
  }

  .footer-link {
    margin-top: 2rem;
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    color: var(--accent);
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  @media (max-width: 900px) {
    .hero-copy,
    .hero-card {
      min-height: auto;
    }
  }

  @media (max-width: 640px) {
    .page {
      width: min(100% - 2rem, 1180px);
      padding-top: 1rem;
    }

    .topbar {
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 2rem;
    }

    .hero-copy,
    .media-stage,
    .hero-card {
      padding: 1.2rem;
    }

    h1 {
      font-size: clamp(2rem, 11vw, 3.3rem);
      margin-bottom: 0.75rem;
    }

    .eyebrow {
      font-size: 0.64rem;
      letter-spacing: 0.18em;
      margin-bottom: 0.85rem;
    }

    .hero-copy-body {
      gap: 1rem;
    }

    .lead,
    .copy-block p {
      font-size: 0.9rem;
    }

    .copy-block-title {
      font-size: 1.5rem;
    }

    .media-video {
      min-height: auto;
    }
  }
</style>
</head>

  document.getElementById("project-overview").textContent = project.overview;
  document.getElementById("project-process").textContent = project.process;

  const mediaStage = document.getElementById("project-media-stage");
  const mediaShell = document.getElementById("project-media");
  const galleryStage = document.getElementById("project-gallery-stage");
  const galleryTrack = document.getElementById("project-gallery");
  const galleryPrev = document.getElementById("gallery-prev");
  const galleryNext = document.getElementById("gallery-next");
  const reportStage = document.getElementById("project-report-stage");
  const reportCopy = document.getElementById("project-report-copy");
  const reportLink = document.getElementById("project-report-link");

  if (project.media && project.media.type === "video") {
    const video = document.createElement("video");
    video.className = "media-video";
    video.controls = true;
    video.preload = "metadata";
    video.playsInline = true;
    video.src = project.media.src;
    mediaShell.appendChild(video);
    mediaStage.hidden = false;
  } else if (project.media && project.media.type === "image") {
    const image = document.createElement("img");
    image.className = "media-image";
    image.src = project.media.src;
    image.alt = project.title;
    mediaShell.appendChild(image);
    mediaStage.hidden = false;
  }

  if (slug === "diseno-uxui") {
    mediaShell.innerHTML = "";
    mediaStage.hidden = true;
  }

  if (project.gallery && project.gallery.length) {
    project.gallery.forEach((src) => {
      const card = document.createElement("div");
      card.className = "gallery-card";
      const isVideo = /\.mp4($|\?)/i.test(src);
      if (isVideo) {
        const video = document.createElement("video");
        video.src = src;
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;
        card.appendChild(video);
      } else {
        const image = document.createElement("img");
        image.src = src;
        image.alt = project.title;
        card.appendChild(image);
      }
      galleryTrack.appendChild(card);
    });

    let galleryIndex = 0;

    const syncGallery = () => {
      galleryTrack.style.transform = `translateX(-${galleryIndex * 100}%)`;
      galleryPrev.disabled = galleryIndex === 0;
      galleryNext.disabled = galleryIndex === project.gallery.length - 1;
    };

    galleryPrev.addEventListener("click", () => {
      if (galleryIndex > 0) {
        galleryIndex -= 1;
        syncGallery();
      }
    });

    galleryNext.addEventListener("click", () => {
      if (galleryIndex < project.gallery.length - 1) {
        galleryIndex += 1;
        syncGallery();
      }
    });

    syncGallery();
    galleryStage.hidden = false;
  }

  if (project.report && project.report.href) {
    reportCopy.textContent = project.report.copy || "Mira el reporte completo aca.";
    reportLink.href = project.report.href;
    reportLink.addEventListener("click", event => {
      event.preventDefault();
      const opened = window.open(project.report.href, "_blank", "noopener,noreferrer");
      if (!opened) window.location.href = project.report.href;
    });
    reportStage.hidden = false;
  }
</script>
</body>
</html>
